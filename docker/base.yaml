name: jajirra

services:
  oathkeeper:
    image: oryd/oathkeeper:v0.40
    ports:
      - "8080:4455"
      - "4456:4456"
    command: serve proxy -c "/etc/config/oathkeeper/oathkeeper.yaml"
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    volumes:
      - ../config/oathkeeper:/etc/config/oathkeeper
