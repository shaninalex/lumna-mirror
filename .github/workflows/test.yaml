name: "Test"

on:
  push:
    branches:
      - 10-tests-in-github-actions

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25.0' ]

    steps:
      - name: setup
        run: mkdir ./bin && mkdir ./app/cmd/standalone/web && touch ./app/cmd/standalone/web/test.txt
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -o bin/lumna ./app/cmd/standalone/
      - name: Test with the Go CLI
        run: go test