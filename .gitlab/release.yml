stages:
  - build
  - release

variables:
  NODE_VERSION: "20"
  GO_VERSION: "1.25.0"

build_app:
  stage: build
  image: node:${NODE_VERSION}
  services:
    - docker:dind
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'   # run only on tags starting with 'v'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq golang make
    - go version
    - node -v
    - yarn -v || npm install -g yarn
  script:
    - cd app/frontend
    - yarn install --frozen-lockfile
    - yarn build
    - cd ../../
    - make build
  artifacts:
    paths:
      - bin/lumna
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/' 
  needs: ["build_app"]
  script:
    - echo "Creating GitLab release for tag $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "lumna binary"
          filepath: "bin/lumna"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/bin/lumna"
