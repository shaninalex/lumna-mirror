<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lumna API Documentation</title>

    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">

    <style>
        body { margin: 0; }

        .cookie-bar {
            font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #1b1b23;
            color: #e6e6ef;
            padding: 16px 20px;
        }

        .cookie-bar h2 { margin: 0 0 4px; font-size: 15px; }
        .cookie-bar p { margin: 0 0 12px; color: #a3a3b8; font-size: 12px; max-width: 90ch; }
        .cookie-bar code { color: #f0c674; }

        .cookie-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
        .cookie-field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 320px; }
        .cookie-field label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #a3a3b8; }

        .cookie-field input {
            padding: 7px 9px;
            border: 1px solid #3a3a4a;
            border-radius: 4px;
            background: #101017;
            color: #e6e6ef;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
        }

        .cookie-actions { display: flex; gap: 8px; }

        .cookie-actions button {
            padding: 8px 14px;
            border: 1px solid #3a3a4a;
            border-radius: 4px;
            background: #2b2b38;
            color: #e6e6ef;
            font-size: 13px;
            cursor: pointer;
        }

        .cookie-actions button.primary { background: #4f46e5; border-color: #4f46e5; }
        .cookie-actions button:hover { filter: brightness(1.15); }

        .cookie-status { margin-top: 10px; font-size: 12px; min-height: 1.4em; color: #a3a3b8; }
        .cookie-status.ok { color: #6ee7a0; }
        .cookie-status.warn { color: #fca5a5; }
    </style>
</head>

<body>

<!--
  Cookie panel.

  The API authenticates with HttpOnly cookies, and browsers refuse to let a script
  set the Cookie header - so the Authorize dialog of Swagger UI cannot help here.
  What a script *can* do is write a real cookie on its own origin through
  document.cookie. That only works when this page is served by the API itself
  (GET /docs), because CORS is configured with Allow-Credentials: false and the
  cookies are scoped to the API host.
-->
<div class="cookie-bar">
    <h2>Session cookies</h2>
    <p>
        Paste tokens here to write real <code>access_token</code> / <code>refresh_token</code>
        cookies on <span id="cookie-origin"></span>. Requests below are sent with
        <code>withCredentials</code>, so the browser attaches them - including the
        <code>HttpOnly</code> pair you already got from <code>POST /api/v1/auth/login</code>.
        Leave a field empty to keep the cookie it already has.
    </p>

    <div class="cookie-row">
        <div class="cookie-field">
            <label for="access-token">access_token (JWT, 15 min)</label>
            <input id="access-token" type="text" spellcheck="false" autocomplete="off"
                   placeholder="eyJhbGciOiJIUzI1NiIs...">
        </div>

        <div class="cookie-field">
            <label for="refresh-token">refresh_token (opaque, 30 days)</label>
            <input id="refresh-token" type="text" spellcheck="false" autocomplete="off"
                   placeholder="9f2c1b...">
        </div>

        <div class="cookie-actions">
            <button id="cookie-apply" class="primary" type="button">Apply cookies</button>
            <button id="cookie-clear" type="button">Clear</button>
        </div>
    </div>

    <div id="cookie-status" class="cookie-status"></div>
</div>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>

<script>
    (function () {
        var ACCESS = "access_token";
        var REFRESH = "refresh_token";

        var statusEl = document.getElementById("cookie-status");
        var accessEl = document.getElementById("access-token");
        var refreshEl = document.getElementById("refresh-token");

        document.getElementById("cookie-origin").textContent = location.origin;

        function say(message, kind) {
            statusEl.textContent = message;
            statusEl.className = "cookie-status" + (kind ? " " + kind : "");
        }

        // Secure cookies are only storable over https; localhost is a trustworthy
        // origin, but plain http on another host would silently drop the flag.
        function setCookie(name, value, maxAge) {
            var parts = [
                name + "=" + value,
                "path=/",
                "max-age=" + maxAge,
                "samesite=Lax"
            ];

            if (location.protocol === "https:") {
                parts.push("secure");
            }

            document.cookie = parts.join("; ");
        }

        function readable() {
            return document.cookie
                .split(";")
                .map(function (c) { return c.trim().split("=")[0]; })
                .filter(function (name) { return name === ACCESS || name === REFRESH; });
        }

        document.getElementById("cookie-apply").addEventListener("click", function () {
            var applied = [];

            if (accessEl.value.trim()) {
                setCookie(ACCESS, accessEl.value.trim(), 15 * 60);
                applied.push(ACCESS);
            }

            if (refreshEl.value.trim()) {
                setCookie(REFRESH, refreshEl.value.trim(), 30 * 24 * 60 * 60);
                applied.push(REFRESH);
            }

            if (!applied.length) {
                say("Nothing to apply - both fields are empty.", "warn");
                return;
            }

            if (!readable().length) {
                say(
                    "Wrote " + applied.join(" and ") + ", but no cookie is readable back. " +
                    "Serve this page from the API origin (GET /docs) - a file:// page cannot set cookies.",
                    "warn"
                );
                return;
            }

            say("Applied " + applied.join(" and ") + " on " + location.origin + ".", "ok");
        });

        document.getElementById("cookie-clear").addEventListener("click", function () {
            setCookie(ACCESS, "", 0);
            setCookie(REFRESH, "", 0);
            accessEl.value = "";
            refreshEl.value = "";
            say(
                "Cleared both cookies on this origin. HttpOnly cookies set by the server " +
                "are shadowed, not removed - call GET /api/v1/auth/logout for a real logout.",
                "ok"
            );
        });

        window.onload = function () {
            SwaggerUIBundle({
                url: "./openapi.yaml",
                dom_id: "#swagger-ui",
                deepLinking: true,
                withCredentials: true,       // send the real session cookies
                persistAuthorization: true,
                tryItOutEnabled: true,
                docExpansion: "list",
                defaultModelsExpandDepth: 1
            });
        };
    })();
</script>

</body>
</html>
