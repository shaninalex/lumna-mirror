      description: >
        Delete project by ID
      tags:
        - Project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the task
          example: 324234
      responses:
        '200':
          description: Success delete project response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
    patch:
      summary: Update specific project
      description: Update the details of a single project by its unique identifier.
      tags:
