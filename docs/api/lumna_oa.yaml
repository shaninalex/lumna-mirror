  /api/v1/projects:
    get:
      summary: Retrieve all projects
      description: Returns a list of projects accessible to the authenticated user.
      tags:
        - Project
      responses:
        '200':
          description: Successfully retrieved projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
    post:
      summary: Create a new project
      description: >-
        Creates a new project with the provided details and returns the created
        project object.
      tags:
        - Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                title:
                  type: string
                  example: Project name
      responses:
        '200':
          description: Successfully created project
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Project'
                  messages:
                    $ref: '#/components/schemas/Message'
  /api/v1/projects/{id}:
