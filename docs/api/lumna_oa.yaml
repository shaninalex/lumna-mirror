openapi: 3.0.0
info:
  title: Lumna API - OpenAPI 3.0
  description: |
    Lumna is a lightweight project and task management platform designed to help teams
    stay organized and productive.  
    
    This API provides access to the core functionality of Lumna, including:
    
    - **Projects**: create and manage projects that group related tasks.  
    - **Tasks**: manage work items within projects, including status, assignments, and deadlines.  
    - **Badges & Labels**: tag tasks with custom identifiers for filtering and categorization.  
    - **Users & Auth**: authenticate, manage user sessions, and assign responsibilities.  
    - **Companies**: look up your company
    
    Use these endpoints to build integrations, automate workflows, or create custom
    front-end experiences on top of Lumna.
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Default local development server
tags:
  - name: Auth
    description: Authentication
  - name: User
    description: User details requests
  - name: Company
    description: Company endpoints
  - name: Project
    description: Project list, details, basic CRUD requests
  - name: Task
    description: Task CRUD requests and specific actions
paths:
  /api/v1/auth/login:
    post:
      summary: Basic user login with email/password
      tags:
        - Auth
      description: |
        Authenticates user and sets an HTTP-only cookie `access_token`. 
        The token is automatically sent with subsequent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPayload'
      responses:
        '200':
          description: Successful login, access_token set in HTTP-only cookie
          headers:
            Set-Cookie:
              description: >
                Contains the access_token cookie. HttpOnly, Secure,
                SameSite=Strict.
              schema:
                type: string
                example: >-
                  access_token=eyJhbGciOi...; HttpOnly; Secure; Path=/;
                  Max-Age=900; SameSite=Strict
          content:
            application/json:
              example:
                status: true
                messages:
                  - text: login successfull
                    type: success
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /api/v1/auth/register:
    post:
      summary: User registration with email and password
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPayload'
      responses:
        '200':
          description: >-
            Successful registration just return empty response and success
            message
          content:
            application/json:
              example:
                status: true
                messages:
                  - text: registration successfull
                    type: success
        '400':
          description: Unsuccessfull registration return error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /api/v1/user/me:
    get:
      summary: Get the authenticated user
      description: Returns the full user object of the currently authenticated account.
      tags:
        - User
      responses:
        '200':
          description: Successfully retrieved user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
  /api/v1/user/update:
    post:
      summary: Update authenticated user
      description: >-
        Updates the authenticated user’s profile information (e.g., username,
        email, or settings).
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                code:
                  type: string
                  example: '@username123875'
                email:
                  type: string
                  format: email
                  example: email@example.com
                settings:
                  $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Successfully updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
  /api/v1/user/logout:
    get:
      summary: Log out authenticated user
      description: >-
        Logs out the currently authenticated user by revoking their session in
        the database and clearing the authentication cookie from the response.
      tags:
        - User
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              example:
                status: true
                messages:
                  - text: logout successful
                    type: success
  /api/v1/company:
    get:
      summary: Retrieve user company
      description: Every user and projects are belongs to the company
      tags:
        - Company
      responses:
        '200':
          description: Successfully retrieved company
          content:
            application/json:
