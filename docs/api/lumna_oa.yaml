openapi: 3.0.4
info:
  title: Swagger Lumna - OpenAPI 3.0
  version: 1.0.0
servers:
  - url: http://localhost:8000
    variables: {}
    description: Default local server
tags:
  - name: Auth
    description: Authentication
  - name: User
    description: User details requests
  - name: Members
    description: Team members ( do not confuse with "User" requests )
  - name: Project
    description: Project list, details, basic CRUD requests
  - name: Task
    description: Task CRUD requests and specific actions
paths:
  /api/v1/auth/login:
    post:
      summary: Basic user login with email/password
      tags:
        - Auth
      description: |
        Authenticates user and sets an HTTP-only cookie `access_token`. 
        The token is automatically sent with subsequent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPayload'
      responses:
        '200':
          description: Successful login, access_token set in HTTP-only cookie
          headers:
            Set-Cookie:
              description: >
                Contains the access_token cookie. HttpOnly, Secure,
                SameSite=Strict.
              schema:
                type: string
                example: >-
                  access_token=eyJhbGciOi...; HttpOnly; Secure; Path=/;
                  Max-Age=900; SameSite=Strict
          content:
            application/json:
              example:
                status: true
                messages:
                  - text: login successfull
                    type: success
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /api/v1/auth/register:
    post:
      summary: User registration with email and password
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPayload'
      responses:
        '200':
          description: >-
            Successful registration just return empty response and success
            message
          content:
            application/json:
              example:
                status: true
                messages:
                  - text: registration successfull
                    type: success
        '400':
          description: Unsuccessfull registration return error message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /api/v1/user/me:
    get:
      summary: Return user object
      tags:
        - User
      responses:
        '200':
          description: Return user object
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
  /api/v1/user/update:
    post:
      summary: Update user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            example:
              code: '@username123875'
              email: email@example.com
              settings:
                theme: light
                language: en
                timezone: UTC
                date_format: 02.01.2006
                time_format: '15:04'
                week_start_day: 1
      responses:
        '200':
          description: Updated user object
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
  /api/v1/user/logout:
    get:
      tags:
        - User
      responses:
        '200':
          description: Clear auth cookie
          content:
            application/json:
              example:
                status: true
                messages:
                  - text: logout successfull
                    type: success
  /api/v1/projects:
    get:
      summary: Get projects
      tags:
        - Project
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
    post:
      summary: Create project
      tags:
        - Project
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
  /api/v1/projects/{id}:
    get:
      summary: Get project
      tags:
        - Project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique code of the project
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
  /api/v1/projects/{id}/tasks:
    get:
      summary: Get project tasks
      tags:
        - Project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique code of the project
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
    post:
      summary: Create task
      tags:
        - Project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique code of the project
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
  /api/v1/tasks/{id}:
    get:
      summary: Get task detail
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
    post:
      summary: Update task
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
  /api/v1/tasks/{id}/status:
    patch:
      summary: Update task status
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
  /api/v1/tasks/{id}/badges:
    post:
      summary: Add badge to task
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
  /api/v1/tasks/{id}/badges/{badgeId}:
    delete:
      summary: Remove badge from task
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
        - name: badgeId
          in: path
          required: true
          schema:
            type: string
          description: Unique id of the badge
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
  /api/v1/tasks/{id}/tags:
    post:
      summary: Add tags to task
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}

  /api/v1/tasks/{id}/tags/{tagId}:
    delete:
      summary: Remove tags from task
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
        - name: tagId
          in: path
          required: true
          schema:
            type: string
          description: Unique id of the badge
          example: 324234
      responses:
        '200':
          description: Success
          content:
            application/json:
              example: {}
components:
  schemas:
    AuthPayload:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: supersecret
      required:
        - email
        - password
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: Project
        code:
          type: string
          example: project-324234
        boards:
          type: array
          description: List of boards within the project
          items:
            $ref: '#/components/schemas/BoardListItem'
        created_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
    BoardListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: Main board
        code:
          type: string
          example: board-324234
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        owner_id:
          type: integer
          format: int64
          description: >-
            ID of the user who owns the task (optional if using
            roles/permissions)
          example: 123
        board_id:
          type: integer
          format: int64
          example: 123
        project_id:
          type: integer
          format: int64
          example: 123
        status_id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: Hello world
        code:
          type: string
          example: task-324234
        completed:
          type: boolean
          example: false
        description:
          type: string
          example: Long task description
        list_index:
          type: integer
          format: int32
          description: Position of the task in the column
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123123123
        code:
          type: string
          example: '@username123875'
        email:
          type: string
          format: email
          example: email@example.com
        settings:
          $ref: '#/components/schemas/UserSettings'
        active:
          type: boolean
          example: true
        state:
          type: string
          enum:
            - active
            - inactive
            - banned
          example: active
        created_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
    UserSettings:
      type: object
      properties:
        theme:
          type: string
          enum:
            - light
            - dark
            - device
          example: light
        language:
          type: string
          example: en
        timezone:
          type: string
          example: UTC
        date_format:
          type: string
          example: 02.01.2006
        time_format:
          type: string
          example: '15:04'
        week_start_day:
          type: integer
          format: int32
          description: Day of week the user prefers to start (1 = Monday)
          example: 1
    Board:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        title:
          type: string
          example: Main board
        code:
          type: string
          example: board-123123
        columns:
          type: array
          description: List of columns in the board
          items:
            $ref: '#/components/schemas/Column'
    Column:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        title:
          type: string
          example: Main board
        index:
          type: integer
          format: int64
          example: 10
    ApiResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        error:
          $ref: '#/components/schemas/Error'
          nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
        messages:
          type: array
          description: Optional system messages
          nullable: true
          items:
            $ref: '#/components/schemas/Message'
        data:
          description: Can be any JSON value
          type: object
          additionalProperties: true
          nullable: true
      required:
        - code
        - meta
    ErrorApiResponse:
      type: object
      properties:
        status:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/Error'
          nullable: true
      required:
        - status
        - error
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Meta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Message:
      type: object
      properties:
        text:
          type: string
          example: Task completed successfully
        type:
          type: string
          enum:
            - success
            - warning
            - error
            - info
          example: success
    Webhook:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123123123
        event:
          type: string
          description: Event that triggers the webhook
          example: task.created
        callback_url:
          type: string
          format: uri
          description: URL to send the webhook payload to
          example: https://mywebhookurl.com/webhook/on/new/task
        active:
          type: boolean
          description: Whether the webhook is currently active
          example: true
