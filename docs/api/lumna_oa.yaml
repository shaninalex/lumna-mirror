                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task in a project
      description: >-
        Adds a new task to the specified project, identified by its unique ID.
        Requires a task title and may include other task details.
      tags:
