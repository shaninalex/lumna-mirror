  /api/v1/tasks/{id}:
    get:
      summary: Retrieve task details
      description: >
        Returns the full details of a specific task, identified by its unique
        ID.   This includes task title, description, status, completion state,
        tags, and other metadata.   Requires authentication.
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the task
          example: 324234
      responses:
        '200':
          description: Successfully retrieved task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
    patch:
      summary: Update task details
      description: >
        Updates the properties of an existing task, identified by its unique
        ID.   Fields such as title, description, status, completion state, tags,
        or list position can be modified.   Only the provided fields will be
        updated; others remain unchanged.   Requires authentication.
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the task
          example: 324234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status_id:
                  type: integer
                  format: int64
                  description: Identifier of the task's status/column
                  example: 123
                title:
                  type: string
                  description: New title for the task
                  example: Hello world
                completed:
                  type: boolean
                  description: Whether the task is marked as completed
                  example: false
                description:
                  type: string
                  description: Detailed description of the task
                  example: Long task description
                list_index:
                  type: integer
                  format: int32
                  description: Position of the task within its column or list
                  example: 1
                badge_id:
                  type: integer
                  format: int32
                  description: Badge id
                  example: 1
                tags:
                  type: array
                  description: Array of string labels (tags) associated with the task
                  items:
                    type: string
                    example: refactoring
      responses:
        '200':
          description: Successfully updated the task
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Bad request — invalid or malformed input data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    $ref: '#/components/schemas/Error'
    delete:
      summary: Delete task
      description: >
        Deleta task by ID
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the task
          example: 324234
      responses:
        '200':
          description: Success delete task response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
  /api/v1/tasks/{id}/status:
    patch:
      summary: Update task status
      description: >
        Updates the status (column) and order of a task within a project
        board.   This endpoint is typically used when moving a task between
        columns or reordering within the same column.   Requires authentication.
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the task
          example: 324234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from_status:
                  type: integer
                  format: int64
                  description: >-
                    Identifier of the current status/column the task is moving
                    from
                  example: 12
                to_status:
                  type: integer
                  format: int64
                  description: Identifier of the new status/column the task is moving to
                  example: 13
                from_index:
                  type: integer
                  format: int64
                  description: Current position (index) of the task in the column
                  example: 2
                to_index:
                  type: integer
                  format: int64
                  description: New position (index) of the task in the column
                  example: 1
      responses:
        '200':
          description: Successfully updated task status and/or position
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Bad request — invalid status or index values
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    $ref: '#/components/schemas/Error'
  /api/v1/tasks/{id}/badges:
    post:
      summary: Add badge to task
      description: >
        Attaches a badge (e.g., *blocked*, *priority*) to a task.   Requires the
        badge identifier and task ID.
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                badge_id:
                  type: integer
                  format: int64
                  description: Unique id of the badge to add
                  example: 12
      responses:
        '200':
          description: Successfully added badge to task
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Bad request — invalid task or badge id
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    $ref: '#/components/schemas/Error'
  /api/v1/tasks/{id}/badges/{badge_id}:
    delete:
      summary: Remove badge from task
      description: >
        Removes a specific badge from a task.   Requires both the task ID and
        the badge ID.
      tags:
        - Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the task
          example: 324234
        - name: badge_id
          in: path
          required: true
          schema:
            type: integer
          description: Unique id of the badge
          example: 12
      responses:
        '200':
          description: Successfully removed badge from task
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Task'
        '400':
          description: Bad request — invalid task or badge id
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  errors:
                    $ref: '#/components/schemas/Error'
components:
  schemas:
    Company:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: Default company name
        created_at:
          type: string
          format: timestamp
          example: 2025-09-22T12:34:56Z
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: blocked
    Badge:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: blocked
        color:
          type: string
          example: '#dcdcdc'
    AuthPayload:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: supersecret
      required:
        - email
        - password
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: Project
        code:
          type: string
          example: project-324234
        boards:
          type: array
          description: List of boards within the project
          items:
            $ref: '#/components/schemas/BoardListItem'
        created_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
    BoardListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: Main board
        code:
          type: string
          example: board-324234
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        owner_id:
          type: integer
          format: int64
          description: >-
            ID of the user who owns the task (optional if using
            roles/permissions)
          example: 123
        board_id:
          type: integer
          format: int64
          example: 123
        project_id:
          type: integer
          format: int64
          example: 123
        status_id:
          type: integer
          format: int64
          example: 123
        title:
          type: string
          example: Hello world
        badge:
          $ref: '#/components/schemas/Badge'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        code:
          type: string
          example: task-324234
        completed:
          type: boolean
          example: false
        description:
          type: string
          example: Long task description
        list_index:
          type: integer
          format: int32
          description: Position of the task in the column
          example: 1
        created_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123123123
        code:
          type: string
          example: '@username123875'
        email:
          type: string
          format: email
          example: email@example.com
        settings:
          $ref: '#/components/schemas/UserSettings'
        active:
          type: boolean
          example: true
        state:
          type: string
          enum:
            - active
            - inactive
            - banned
          example: active
        created_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-09-22T12:34:56Z'
    UserSettings:
      type: object
      properties:
        theme:
          type: string
          enum:
            - light
            - dark
            - device
          example: light
        language:
          type: string
          example: en
        timezone:
          type: string
          example: UTC
        date_format:
          type: string
          example: 02.01.2006
        time_format:
          type: string
          example: '15:04'
        week_start_day:
          type: integer
          format: int32
          description: Day of week the user prefers to start (1 = Monday)
          example: 1
    Board:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        title:
          type: string
          example: Main board
        code:
          type: string
          example: board-123123
        columns:
          type: array
          description: List of columns in the board
          items:
            $ref: '#/components/schemas/Column'
    Column:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        title:
          type: string
          example: In progress
        index:
          type: integer
          format: int64
          example: 10
    ApiResponse:
      type: object
      properties:
        status:
          type: boolean
          example: true
        error:
          $ref: '#/components/schemas/Error'
          nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
        messages:
          type: array
          description: Optional system messages
          nullable: true
          items:
            $ref: '#/components/schemas/Message'
        data:
          description: Can be any JSON value
          type: object
          additionalProperties: true
          nullable: true
      required:
        - code
        - meta
    ErrorApiResponse:
      type: object
      properties:
        status:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/Error'
          nullable: true
      required:
        - status
        - error
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Meta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Message:
      type: object
      properties:
        text:
          type: string
          example: Message text
        type:
          type: string
          enum:
            - success
            - warning
            - error
            - info
          example: success
    Webhook:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 876458
        event:
          type: string
          description: Event that triggers the webhook
          example: task.created
        callback_url:
          type: string
          format: uri
          description: URL to send the webhook payload to
          example: https://mywebhookurl.com/webhook/on/new/task
        active:
          type: boolean
          description: Whether the webhook is currently active
          example: true
