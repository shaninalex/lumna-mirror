<div cdkDropListGroup class="flex flex-row no-wrap gap-4">
    @for (list of columns; track list) {
        <div class="bg-slate-200 w-sm rounded p-4">
            <div class="mb-2">
                <div class="font-bold text-slate-500">{{ list.title }}</div>
            </div>
            <div class="flex flex-col gap-2 min-h-20"
                 cdkDropList
                 [id]="list.id"
                 [cdkDropListData]="list.issues"
                 (cdkDropListDropped)="drop($event)">
                @for (issue of list.issues; track issue.id) {
                    <ts-issue-card [task]="issue" [cdkDragData]="issue" cdkDrag/>
                }
            </div>
        </div>
    }
</div>
