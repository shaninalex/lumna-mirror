<div class="card">
    <div class="card-body">
        <h1>Create workspace</h1>

        <form (submit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Workspace title</label>
                <input
                    type="text"
                    [formField]="workspaceForm.title"
                    class="form-control"
                    placeholder="Workspace title"
                />
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input
                    type="email"
                    [formField]="workspaceForm.email"
                    class="form-control"
                    placeholder="name@example.com"
                />
            </div>

            <div>
                <button class="btn btn-primary" type="submit">Next</button>
            </div>
        </form>
    </div>
</div>
