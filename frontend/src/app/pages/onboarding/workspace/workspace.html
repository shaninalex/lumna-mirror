<div class="card">
    <div class="card-body">
        <h1>Create workspace</h1>

        <form action="">
            <div class="mb-3">
                <label class="form-label">Workspace title</label>
                <input
                    type="text"
                    class="form-control"
                    placeholder="Workspace title"
                />
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input
                    type="email"
                    class="form-control"
                    placeholder="name@example.com"
                />
            </div>

            <div>
                <button class="btn btn-primary" type="submit">Next</button>
            </div>
        </form>
    </div>
</div>
