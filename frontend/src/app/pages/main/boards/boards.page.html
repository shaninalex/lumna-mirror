<lu-main-layout>
    <div class="container py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Boards</h2>
                <p class="text-muted mb-0">Organize your project's work into multiple boards.</p>
            </div>

            <a [routerLink]="appRoutes.boardsCreate()" class="btn btn-primary btn-sm">
                <i class="fa-solid fa-plus me-2"></i>
                New Board
            </a>
        </div>

        <!-- Boards -->
        <div class="list-group">
            @if (boards$ | async; as boards) {
                @for (board of boards; track $index) {
                    <a
                        routerLink="/app/w/1/board"
                        class="list-group-item list-group-item-action py-3"
                    >
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="me-3">
                                <h5 class="mb-1">{{ board.title }}</h5>

                                <p class="mb-2 text-muted">
                                    Main board for feature development, bugs and improvements.
                                </p>

                                <div class="d-flex gap-3 small text-muted">
                                    <span>42 cards</span>
                                    <span>5 columns</span>
                                    <span>Updated 2 hours ago</span>
                                </div>
                            </div>

                            <i class="fa-solid fa-chevron-right text-muted mt-1"></i>
                        </div>
                    </a>
                }
            }
        </div>
    </div>
</lu-main-layout>
