<lu-main-layout>
    <div class="container py-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Backlog</h2>
                <p class="text-muted mb-0">
                    All tasks across every board, grouped by creation date.
                </p>
            </div>

            <a [routerLink]="[...appRoutes.createTask()]" class="btn btn-primary">
                <i class="fa-solid fa-plus me-2"></i>
                New Task
            </a>
        </div>

        @if(data$ | async; as data) {
            <div class="mb-5">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h5 class="mb-0">Today</h5>
                    <span class="badge text-bg-secondary">3 tasks</span>
                </div>

                <div class="list-group">
                    @for (item of data.tasks; track $index) {
                        <lu-task-list-item [task]="item" />
                    }
                </div>
            </div>
        }
        <!-- Yesterday -->
        <div class="mb-5">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0">Yesterday</h5>
                <span class="badge text-bg-secondary">5 tasks</span>
            </div>
            <div class="list-group">

            </div>
        </div>

        <!-- This Week -->
        <div>
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="mb-0">Earlier This Week</h5>
                <span class="badge text-bg-secondary">12 tasks</span>
            </div>
            <div class="list-group">

            </div>
        </div>
    </div>

</lu-main-layout>
