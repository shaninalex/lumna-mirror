<div class="card">
    <div class="card-body">
        <a [routerLink]="[detailUrl()]" class="card-title d-block mb-2 fw-medium text-decoration-none">
            {{ task.title }}
        </a>

        <div class="d-flex justify-content-between align-items-center">
            <button class="btn-sm btn p-0 d-flex justify-content-between align-items-center gap-1">
                <img class="rounded-circle" src="img/7.png" style="width: 16px; height: 16px;"/>
                <div>John Doe</div>
            </button>

            <time>
                <i class="fa-regular fa-calendar"></i>
                {{ task.created_at | date: 'd MMM' }}
            </time>
        </div>
    </div>
</div>
