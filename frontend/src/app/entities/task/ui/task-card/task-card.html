<div class="card">
    <div class="is-flex is-justify-content-space-between is-align-items-center">
        <a [routerLink]="[detailUrl()]" class="card-header-title">
            {{ task.title }}
        </a>
        <button class="card-header-icon">
            <span class="icon">
                <i class="fa-solid fa-ellipsis"></i>
            </span>
        </button>
    </div>

    <div class="card-content pt-0 px-3 pb-3">
        <div class="is-flex is-justify-content-space-between is-align-items-center">
            <button class="is-flex is-justify-content-space-between is-align-items-center gap-1">
                <figure class="image is-16x16">
                    <img src="img/7.png" alt="" class="is-rounded" />
                </figure>

                <div>John Doe</div>
            </button>

            <time>
                <i class="fa-regular fa-calendar"></i>
                {{ task.created_at | date: 'd MMM' }}
            </time>
        </div>
    </div>
</div>
