<h3 class="font-medium">Create new board</h3>
<form (submit)="submit($event)" class="d-flex flex-col gap-2">
    <div>
        <input
            class="border block w-full rounded-lg px-2 py-1 border-gray-400"
            type="text"
            placeholder="Board title"
            autocomplete="off"
            [formField]="boardForm.title"
        />
        @if (boardForm.title().dirty() && boardForm.title().errors()) {
            <ul class="error-list">
                @for (error of boardForm.title().errors(); track error) {
                    <li class="text-red-500 text-sm">{{ error.message }}</li>
                }
            </ul>
        }
    </div>

    <div class="d-flex items-center gap-4">
        <button type="submit" class="btn is-primary is-small" [disabled]="boardForm().invalid()">
            Create
        </button>

        <button type="btn" (pointerdown)="cancel()" class="btn is-small  is-dark">
            Cancel
        </button>
    </div>
</form>
