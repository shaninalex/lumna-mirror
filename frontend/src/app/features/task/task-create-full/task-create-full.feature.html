<form (submit)="onSubmit($event)" class="flex gap-2">
    <div class="mb-4">
        <label for="task_title" class="form-label">Title</label>
        <input type="text" class="form-control" id="task_title" [formField]="taskForm.title">
    </div>

    <div class="mb-4">
        <label for="task-body" class="form-label">Body</label>
        <textarea type="text" class="form-control" id="task-body" [formField]="taskForm.body"></textarea>
    </div>

    <button 
        class="btn btn-primary" 
        type="submit"
        [disabled]="taskForm.title().touched() && taskForm.title().invalid()"
    >
        Create
    </button>
</form>
