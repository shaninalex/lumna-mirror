@if (board$ | async; as board) {
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">{{ board.title }}</h2>
            <p class="text-muted mb-0">24 cards · Updated 5 minutes ago</p>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" disabled>
                <i class="fa-solid fa-filter me-2"></i>
                Filter
            </button>

            <button class="btn btn-sm btn-outline-secondary" disabled>
                <i class="fa-solid fa-users me-2"></i>
                Members
            </button>

            <button class="btn btn-sm btn-primary">
                <i class="fa-solid fa-plus me-2"></i>
                New Task
            </button>
        </div>
    </div>

    <div class="d-flex gap-3 pb-2">
        <div style="min-width: 320px">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>Todo</strong>
                    <span class="badge text-bg-secondary">8</span>
                </div>
                <div class="card-body d-flex flex-column gap-3">
                    <lu-task-card />
                    <lu-task-card />
                </div>
            </div>
        </div>

        <!-- Add Column -->
        <div style="min-width: 280px">
            <lu-new-column-form [board_id]="boardId" />
        </div>
    </div>
}
