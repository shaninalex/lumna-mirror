<form (submit)="submit($event)" class="d-flex flex-col gap-2">
    <div>
        <input
            class="border block w-full rounded-lg px-2 py-1 border-gray-400"
            type="text"
            autocomplete="off"
            placeholder="Project title"
            [formField]="projectForm.title"
        />
        @if (projectForm.title().dirty()) {
            <ul class="error-list">
                @for (error of projectForm.title().errors(); track error) {
                    <li class="text-red-500 text-sm">{{ error.message }}</li>
                }
            </ul>
        }
    </div>

    <div class="d-flex items-center gap-4">
        <button
            type="submit"
            class="btn is-primary is-small"
            [disabled]="projectForm().invalid()"
        >
            Create
        </button>

        <button
            type="btn"
            (click)="cancel()"
            class="btn is-small  is-dark"
        >
            Cancel
        </button>
    </div>
</form>
