<div class="card">
    <div class="card-body">
        <form (submit)="submit($event)">
            <div class="mb-3">
                <input
                    class="form-control"
                    type="text"
                    autocomplete="off"
                    placeholder="Project title"
                    [formField]="projectForm.title"
                />
                @if (projectForm.title().dirty()) {
                    @for (error of projectForm.title().errors(); track error) {
                        <div class="text-danger btn-sm">{{ error.message }}</div>
                    }
                }
            </div>

            <div class="d-flex items-center gap-4">
                <button type="submit" class="btn btn-primary btn-sm" [disabled]="projectForm().invalid()">
                    Create
                </button>
                <button type="button" (click)="cancel()" class="btn btn-sm btn-secondary">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
