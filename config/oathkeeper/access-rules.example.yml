- id: "auth-service"
  upstream:
    preserve_host: true
    url: "http://localhost:8000"
  match:
    url: "http://localhost:8080/api/auth/<**>"
    methods:
      - POST
      - GET
      - PUT
      - PATCH
      - DELETE
  authenticators:
    - handler: noop
  mutators:
    - handler: noop
  authorizer:
    handler: allow

- id: "project-service"
  upstream:
    preserve_host: true
    url: "http://localhost:8001"
  match:
    url: "http://localhost:8080/api/project/<**>"
    methods:
      - POST
      - GET
      - PUT
      - PATCH
      - DELETE
  authenticators:
    - handler: cookie_session
  mutators:
    - handler: header
  authorizer:
    handler: allow

